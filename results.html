<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Results - Sahithyotsav</title>

  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico"/>

  <style>

    .results-section{
      padding:60px 0;
      min-height:100vh;
    }

    .results-heading{
      text-align:center;
      margin-bottom:40px;
    }

    .results-heading h1{
      font-size:3rem;
      margin-bottom:10px;
    }

    .results-heading p{
      color:var(--muted);
      font-size:1rem;
    }

    .filters{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      margin-bottom:30px;
    }

    .filter-card{
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      box-shadow:var(--shadow);
    }

    .filter-select{
      width:100%;
      padding:14px 16px;
      border-radius:14px;
      border:1px solid var(--border);
      background:var(--card-bg);
      color:var(--text);
      font-size:1rem;
      font-family:PoppinsLocal, sans-serif;
      outline:none;
    }

    .filter-select option{
      background:#0f1724;
      color:#ffffff;
    }

    .recent-title{
      margin:40px 0 20px;
      font-size:1.4rem;
    }

    .recent-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:18px;
    }

    .recent-card{
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:18px;
      padding:22px;
      cursor:pointer;
      transition:0.25s;
      box-shadow:var(--shadow);
    }

    .recent-card:hover{
      transform:translateY(-5px);
      border-color:var(--accent);
    }

    .recent-category{
      color:var(--accent);
      font-size:0.9rem;
      font-weight:700;
      margin-bottom:10px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .recent-competition{
      font-size:1.3rem;
      font-weight:700;
      color:var(--text);
      line-height:1.4;
    }

    .recent-updated{
      margin-top:14px;
      color:var(--muted);
      font-size:0.9rem;
    }

    .result-display{
      margin-top:40px;
      display:none;
    }

    .result-card{
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:24px;
      padding:30px;
      box-shadow:var(--shadow);
    }

    .result-header{
      margin-bottom:30px;
    }

    .result-category{
      color:var(--accent);
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
      margin-bottom:10px;
    }

    .result-title{
      font-size:2.3rem;
      line-height:1.2;
    }

    .winner-list{
      display:grid;
      gap:18px;
      margin-top:25px;
    }

    .winner-item{
      display:flex;
      gap:18px;
      align-items:center;
      background:rgba(255,255,255,0.03);
      border:1px solid var(--border);
      border-radius:18px;
      padding:20px;
    }

    .winner-rank{
      width:80px;
      height:80px;
      border-radius:18px;
      background:linear-gradient(135deg,var(--accent),var(--accent-dark));
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.5rem;
      font-weight:700;
      color:#022;
      flex-shrink:0;
    }

    .winner-info h3{
      margin:0;
      font-size:1.4rem;
    }

    .winner-info p{
      margin:6px 0 0;
      color:var(--muted);
      font-size:1rem;
    }

    .poster-btn{
      margin-top:30px;
      width:100%;
      font-size:1rem;
      padding:14px;
    }

    .empty-message{
      text-align:center;
      padding:50px 20px;
      color:var(--muted);
    }

    @media(max-width:700px){

      .filters{
        grid-template-columns:1fr;
      }

      .results-heading h1{
        font-size:2.2rem;
      }

      .result-title{
        font-size:1.7rem;
      }

      .winner-item{
        flex-direction:column;
        align-items:flex-start;
      }

    }

  </style>

</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar">

    <div class="navbar-left">
      <img src="images/logo.png" class="logo1" alt="">
      <img src="images/sah-en.png" class="logo2" alt="">
    </div>

    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="results.html">Results</a></li>
      <li><a href="leaderboard.html">Leaderboard</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="donate.html">Donate</a></li>
    </ul>

    <button id="themeToggle" class="theme-toggle">
      <span class="dot"></span>
    </button>

    <button id="hamburger" class="hamburger">
      ☰
    </button>

  </nav>

  <!-- RESULTS -->

  <section class="results-section">

    <div class="container">

      <div class="results-heading">
        <h1>Competition Results</h1>
        <p>Select category and competition to view results</p>
      </div>

      <!-- FILTERS -->

      <div class="filters">

        <div class="filter-select">

          <label>Select Category</label>

          <select id="categoryFilter">
            <option value="">Choose Category</option>
          </select>

        </div>

        <div class="filter-select">

          <label>Select Competition</label>

          <select id="competitionFilter">
            <option value="">Choose Competition</option>
          </select>

        </div>

      </div>

      <!-- RECENT RESULTS -->

      <h2 class="recent-title">Recently Updated Results</h2>

      <div class="recent-grid" id="recentGrid"></div>

      <!-- RESULT DISPLAY -->

      <div class="result-display" id="resultDisplay">

        <div class="result-card">

          <div class="result-header">

            <div class="result-category" id="displayCategory"></div>

            <h2 class="result-title" id="displayCompetition"></h2>

          </div>

          <div class="winner-list">

            <div class="winner-item">

              <div class="winner-rank">1st</div>

              <div class="winner-info">
                <h3 id="firstName"></h3>
                <p id="firstTeam"></p>
              </div>

            </div>

            <div class="winner-item">

              <div class="winner-rank">2nd</div>

              <div class="winner-info">
                <h3 id="secondName"></h3>
                <p id="secondTeam"></p>
              </div>

            </div>

            <div class="winner-item">

              <div class="winner-rank">3rd</div>

              <div class="winner-info">
                <h3 id="thirdName"></h3>
                <p id="thirdTeam"></p>
              </div>

            </div>

          </div>

          <button class="button poster-btn" id="posterBtn">
            <i class="fas fa-image"></i>
            Generate Poster
          </button>

        </div>

      </div>

    </div>

  </section>

  <footer class="footer">
    © SSF Koottilangadi Sector Committee
  </footer>

  <script src="script.js"></script>

  <script>

    const categoryFilter = document.getElementById("categoryFilter");
    const competitionFilter = document.getElementById("competitionFilter");

    const recentGrid = document.getElementById("recentGrid");

    const resultDisplay = document.getElementById("resultDisplay");

    let resultsData = [];
    let currentResult = null;

    async function loadCSV() {

      const response = await fetch("results.csv");

      const text = await response.text();

      const rows = text.trim().split("\n");

      const headers = rows[0].split(",");

      resultsData = rows.slice(1).map(row => {

        const values = row.split(",");

        let obj = {};

        headers.forEach((header, index) => {
          obj[header.trim()] = values[index]?.trim();
        });

        return obj;
      });

      populateFilters();

      renderRecentCards();

    }

    function populateFilters() {

      const categories =
        [...new Set(resultsData.map(r => r.category))];

      categoryFilter.innerHTML =
        `<option value="">Choose Category</option>`;

      categories.forEach(cat => {

        categoryFilter.innerHTML +=
          `<option value="${cat}">${cat}</option>`;

      });

    }

    categoryFilter.addEventListener("change", () => {

      const category = categoryFilter.value;

      const competitions =
        resultsData
        .filter(r => r.category === category)
        .map(r => r.competition);

      competitionFilter.innerHTML =
        `<option value="">Choose Competition</option>`;

      competitions.forEach(comp => {

        competitionFilter.innerHTML +=
          `<option value="${comp}">${comp}</option>`;

      });

    });

    competitionFilter.addEventListener("change", () => {

      const category = categoryFilter.value;
      const competition = competitionFilter.value;

      const result =
        resultsData.find(r =>
          r.category === category &&
          r.competition === competition
        );

      if(result){
        showResult(result);
      }

    });

    function renderRecentCards(){

      recentGrid.innerHTML = "";

      const latest =
        [...resultsData].reverse().slice(0,6);

      latest.forEach(result => {

        const card = document.createElement("div");

        card.className = "recent-card";

        card.innerHTML = `
          <div class="recent-category">
            ${result.category}
          </div>

          <div class="recent-competition">
            ${result.competition}
          </div>

          <div class="recent-updated">
            Click to view result
          </div>
        `;

        card.addEventListener("click", () => {
          showResult(result);
        });

        recentGrid.appendChild(card);

      });

    }

    function showResult(result){

      currentResult = result;

      resultDisplay.style.display = "block";

      document.getElementById("displayCategory")
        .innerText = result.category;

      document.getElementById("displayCompetition")
        .innerText = result.competition;

      document.getElementById("firstName")
        .innerText = result.first_name;

      document.getElementById("firstTeam")
        .innerText = result.first_team;

      document.getElementById("secondName")
        .innerText = result.second_name;

      document.getElementById("secondTeam")
        .innerText = result.second_team;

      document.getElementById("thirdName")
        .innerText = result.third_name;

      document.getElementById("thirdTeam")
        .innerText = result.third_team;

      window.scrollTo({
        top: resultDisplay.offsetTop - 100,
        behavior: "smooth"
      });

    }

    document.getElementById("posterBtn")
      .addEventListener("click", () => {

      if(currentResult){
        generatePoster(currentResult);
      }

    });

    function generatePoster(result) {

      const canvas = document.createElement("canvas");

      const ctx = canvas.getContext("2d");

      canvas.width = 1080;
      canvas.height = 1350;

      const template =
        result.template === "green"
          ? "poster2.jpg"
          : "poster1.jpg";

      const bg = new Image();

      bg.src = template;

      bg.onload = () => {

        ctx.drawImage(bg,0,0,1080,1350);

        ctx.fillStyle = "white";
        ctx.textAlign = "left";

        // CATEGORY

        ctx.font = "48px Arial";

        ctx.fillText(
          result.category,
          160,
          420
        );

        // TITLE

        ctx.fillStyle = "#E7FF4F";

        ctx.font = "bold 90px Arial";

        const titleLines =
          wrapText(
            ctx,
            result.competition.toUpperCase(),
            650
          );

        let titleY = 520;

        titleLines.forEach(line => {

          ctx.fillText(line,150,titleY);

          titleY += 95;

        });

        // WINNERS

        drawWinner(
          ctx,
          "01",
          result.first_name,
          result.first_team,
          760
        );

        drawWinner(
          ctx,
          "02",
          result.second_name,
          result.second_team,
          900
        );

        drawWinner(
          ctx,
          "03",
          result.third_name,
          result.third_team,
          1040
        );

        const link =
          document.createElement("a");

        link.download =
          `${result.competition}.png`;

        link.href = canvas.toDataURL();

        link.click();

      };

    }

    function drawWinner(
      ctx,
      position,
      name,
      team,
      y
    ){

      ctx.fillStyle = "white";

      ctx.font = "bold 74px Arial";

      ctx.fillText(position,140,y);

      ctx.font = "bold 44px Arial";

      ctx.fillText(name,290,y);

      ctx.font = "36px Arial";

      ctx.fillText(team,290,y + 42);

    }

    function wrapText(
      ctx,
      text,
      maxWidth
    ){

      const words = text.split(" ");

      let lines = [];
      let line = "";

      for(let n=0;n<words.length;n++){

        const testLine =
          line + words[n] + " ";

        const metrics =
          ctx.measureText(testLine);

        const testWidth =
          metrics.width;

        if(testWidth > maxWidth && n > 0){

          lines.push(line);

          line = words[n] + " ";

        }else{

          line = testLine;

        }

      }

      lines.push(line);

      return lines;

    }

    loadCSV();

  </script>

</body>
