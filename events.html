		.stages { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; }

		.schedule { margin-top:12px; }
		table.schedule-table { width:100%; border-collapse:collapse; }
		table.schedule-table th, table.schedule-table td { padding:10px; border-bottom:1px solid var(--border); text-align:left; color:var(--text); }
		tr.ongoing { background: rgba(255,183,3,0.08); }
		tr.upcoming { background: rgba(14,115,232,0.06); }
		.badge { font-size:12px; padding:4px 6px; border-radius:4px; margin-left:8px; }
		.badge.current { background:#ffb703; color:#000; }
		.badge.next { background:#90caf9; color:#022f66; }
		.no-events { color:var(--muted); padding:12px 0; }
	</style>

		const stagesEl = document.getElementById('stages');
		const scheduleContainer = document.getElementById('schedule-container');
		const stageTitle = document.getElementById('stage-title');

		let selectedStage = localStorage.getItem('selectedStage') || 'SOULSCAPE';

		function renderStageButtons() {
			stagesEl.innerHTML = '';
			STAGES.forEach(stage => {
				const btn = document.createElement('button');
				btn.className = 'stage-btn' + (stage === selectedStage ? ' active' : '');
				btn.textContent = stage;
				btn.addEventListener('click', () => {
					selectedStage = stage;
					localStorage.setItem('selectedStage', stage);
					update();
				});
				stagesEl.appendChild(btn);
			});
		}

		function parseTimeToDate(timeStr) {
			const [hh, mm] = timeStr.split(':').map(Number);
			const d = new Date();
			d.setHours(hh, mm, 0, 0);
			return d;
		}

		function buildScheduleTable(stage) {
			const events = (SCHEDULES[stage] || []).slice();
			if (!events.length) {
				return '<div class="no-events">No scheduled programs for this stage.</div>';
			}

			// compute date objects for today
			const now = new Date();
			const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

			const rows = events.map(ev => {
				const start = new Date(today);
				const [sh, sm] = ev.start.split(':').map(Number);
				start.setHours(sh, sm, 0, 0);
				const end = new Date(today);
				const [eh, em] = ev.end.split(':').map(Number);
				end.setHours(eh, em, 0, 0);
				return { ...ev, startDate: start, endDate: end };
			});

			// find current and next
			let currentIndex = -1;
			for (let i = 0; i < rows.length; i++) {
				if (now >= rows[i].startDate && now < rows[i].endDate) { currentIndex = i; break; }
			}
			let nextIndex = rows.findIndex((r, i) => r.startDate > now);

			// if nothing upcoming and nothing current, nextIndex remains -1

			let html = '<table class="schedule-table"><thead><tr><th>Program</th><th>Start</th><th>End</th></tr></thead><tbody>';
			rows.forEach((r, i) => {
				const classes = [];
				let badge = '';
				if (i === currentIndex) { classes.push('ongoing'); badge = '<span class="badge current">Ongoing</span>'; }
				else if (i === nextIndex) { classes.push('upcoming'); badge = '<span class="badge next">Next</span>'; }
				html += `<tr class="${classes.join(' ')}"><td>${r.name} ${badge}</td><td>${r.start}</td><td>${r.end}</td></tr>`;
			});
			html += '</tbody></table>';
			return html;
		}

		function update() {
			renderStageButtons();
			stageTitle.textContent = selectedStage;
			scheduleContainer.innerHTML = buildScheduleTable(selectedStage);
		}

		// refresh every 20 seconds to update highlighting
		setInterval(() => {
			// Re-render table only (keeps selected state and buttons intact)
			scheduleContainer.innerHTML = buildScheduleTable(selectedStage);
		}, 20000);

		// initial render
		renderStageButtons();
		update();

	</script>
